<!DOCTYPE html>
<html>
<head>
  <title>PhishGuard</title>
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: Arial, sans-serif;
    }
    .header {
      display: flex;
      align-items: center;
      margin-bottom: 15px;
    }
    .logo {
      width: 32px;
      height: 32px;
      margin-right: 10px;
    }
    h1 {
      font-size: 18px;
      margin: 0;
      color: #333;
    }
    .status {
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      text-align: center;
    }
    .safe {
      background-color: #d4edda;
      color: #155724;
    }
    .warning {
      background-color: #fff3cd;
      color: #856404;
    }
    .danger {
      background-color: #f8d7da;
      color: #721c24;
    }
    .details {
      margin-top: 15px;
    }
    .detail-item {
      margin-bottom: 8px;
    }
    button {
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 8px 12px;
      text-align: center;
      text-decoration: none;
      display: inline-block;
      font-size: 14px;
      margin: 4px 2px;
      cursor: pointer;
      border-radius: 4px;
    }
    .last-updated {
      font-size: 12px;
      color: #666;
      margin-top: 15px;
    }
  </style>
</head>
<body>
  <div class="header">
    <img src="icons/icon48.png" class="logo" alt="PhishGuard logo">
    <h1>PhishGuard</h1>
  </div>
  
  <div id="status" class="status safe">
    Checking current page...
  </div>
  
  <div id="details" class="details">
    <!-- Details will be populated by popup.js -->
  </div>
  
  <div class="last-updated">
    Last updated: <span id="updateTime">Never</span>
  </div>
  
  <button id="refreshBtn">Refresh Data</button>
  
  <script src="popup.js"></script>
</body>
</html>
